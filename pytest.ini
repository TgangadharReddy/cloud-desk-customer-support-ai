[pytest]
; Adds the project root (where this file lives) to sys.path before test
; collection. This is what lets tests/test_rag.py do:
;     from app.config import settings
; without needing app/ to be pip-installed as a package, and without a
; conftest.py doing manual sys.path.insert() hacks.
;
; Requires pytest >= 7.0 (this project pins pytest==8.3.3 in
; requirements.txt, so the option is available).
pythonpath = .

testpaths = tests